# Static application security testing + supply-chain review.
#
# WHY: before this file, the repo had no SAST of any kind. `ci.yml`'s `guard`
# job carries hand-written pattern checks (raw SQL interpolation, unguarded
# mutation routes, console.* in production source) which are valuable but are
# grep-shaped — they catch the specific mistakes this repo has already made, by
# construction. Nothing looked for the classes it has not made yet: taint flow
# from `req` into a sink, path traversal, unsafe deserialization, prototype
# pollution, ReDoS. That is what CodeQL does, and for a codebase handling money,
# auth and multi-tenant data it is the floor, not the ceiling.
#
# Both actions here are GitHub first-party (`github/`, `actions/`) — the same
# trust level as `actions/checkout`, which every job in `ci.yml` already runs.
# No third-party action, no new vendor account, no new secret. That is a
# deliberate constraint: this repo pins even actionlint to an immutable release
# tag rather than piping a script from a mutable ref, and an audit PR is the
# wrong place to unilaterally widen the supply-chain surface.
#
# NOT COVERED HERE, and deliberately so — see the audit's Security section:
#   - Container image scanning (Trivy/Grype). `ci.yml`'s docker-build job
#     already produces the image; scanning it needs a third-party action, which
#     is Sri's supply-chain call to make, not an audit's.
#   - Secret scanning + push protection. GitHub-native, but a repo *setting*
#     (Settings → Code security), not a workflow — cannot be enabled from here.
#     `tools/hygiene-check.mjs` covers the committed-secret case in the
#     meantime; it cannot cover history or push-time.
#   - License compliance. Needs a policy decision (which licenses are
#     acceptable) before a tool can enforce anything.
name: Security

on:
  push:
    branches: [develop, staging, master]
  pull_request:
    branches: [develop, staging, master]
  schedule:
    # Weekly re-scan on a fixed branch: CodeQL's query packs improve over time,
    # so code that was clean at merge can be newly-flagged months later without
    # anyone touching it. Monday 07:00 UTC, ahead of the 09:00 backup job.
    - cron: "0 7 * * 1"

# `security-events: write` is what lets CodeQL upload its SARIF results into the
# repo's Security tab. Everything else stays read-only, matching the
# least-privilege default the other three workflows already set.
permissions:
  contents: read
  security-events: write

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codeql:
    name: CodeQL — JavaScript/TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          # security-and-quality adds maintainability queries on top of the
          # default security set. Chosen over `security-extended` because this
          # codebase's dominant real defect class (found repeatedly in its own
          # audits) is duplication and drift, not exotic injection — and the
          # extended set's extra false-positive rate on a 140k-line tree would
          # bury the findings that matter.
          queries: security-and-quality
          # Analyse the shipping application only. `artifacts/` is a 1,005-file
          # parallel codebase that is not built, not tested, not deployed and
          # not reachable from any entry point in this repo (see the audit's
          # Technology Inventory) — scanning it would triple the runtime and
          # every finding would be unactionable.
          config: |
            paths:
              - src
              - web
              - scripts
              - tools
              - api
            paths-ignore:
              - "**/*.test.ts"
              - "**/*.test.tsx"
              - web/mocks
              - web/e2e
      # No `autobuild`: this is an interpreted-language analysis, and both
      # halves of the app already typecheck in ci.yml. Skipping the build keeps
      # this job independent of ci.yml's install/build steps and roughly halves
      # its runtime.
      - name: Analyze
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:javascript-typescript"

  dependency-review:
    name: Dependency review (PRs — block new high/critical)
    # PR-only by design: this action diffs the base and head manifests, so it
    # has nothing to compare on a push. It is the complement to ci.yml's
    # `npm audit` gate, which only ever sees the merged end state — this one
    # catches the advisory *arriving*, and names the PR that brought it.
    #
    # SKIPS UNTIL EXPLICITLY ENABLED. On its first real run this job failed in
    # 7 seconds with:
    #
    #   Dependency review is not supported on this repository.
    #   Please ensure that Dependency graph is enabled
    #
    # The action requires GitHub's Dependency graph feature, which is a
    # repository *setting* (Settings → Code security → Dependency graph), not
    # something a workflow can turn on. Until it is enabled this job can only
    # ever fail, and a check that always fails is as useless as one that can
    # never fail — the exact anti-pattern ADR-008 was written about.
    #
    # So it is gated behind a repo variable, matching how every other
    # not-yet-configured tier in this pipeline behaves (`deploy-dev` skips on an
    # empty DEV_BACKEND_URL; `backup.yml` skips without PROD_DATABASE_URL):
    # skip cleanly now, become a real gate the moment someone opts in.
    #
    # TO ENABLE (Sri): turn on Dependency graph at
    # https://github.com/Sricharangellu/Ascend/settings/security_analysis, then
    # set the repo variable DEPENDENCY_REVIEW_ENABLED=true under
    # Settings → Secrets and variables → Actions → Variables.
    if: github.event_name == 'pull_request' && vars.DEPENDENCY_REVIEW_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          # Matches ci.yml's root `npm audit --audit-level=high` gate, so a
          # dependency cannot enter through the PR path at a severity the
          # merged-state gate would then reject.
          fail-on-severity: high
          comment-summary-in-pr: on-failure

  # ── Added by the ERP infrastructure audit (PR #197) ────────────────────────
  # These three are complementary to the two above, not alternatives: CodeQL and
  # dependency-review look at code and at *new* dependency edges; these look for
  # committed credentials, the advisory state of what is already installed, and
  # what is in the build at all. Two parallel audits (PR #198 and PR #197) landed
  # on the same week and each found a different half of the gap — the union is
  # what neither had alone. Gating policy for each is ADR-010.

  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: a credential deleted in a later commit is still
          # published — removing the line does not unpublish the secret. The
          # scheduled run is the one that benefits most from this.
          fetch-depth: 0
      # Pinned to an immutable release tag and checksum-free-but-versioned,
      # matching how ci.yml pins actionlint. Do NOT switch to a `latest` URL:
      # piping an unpinned release into a privileged runner is the supply-chain
      # risk this repo already decided against once.
      - name: Install gitleaks
        run: |
          set -euo pipefail
          GITLEAKS_VERSION=8.28.0
          curl -fsSL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks version
      - name: Scan working tree
        run: /tmp/gitleaks dir . -c .gitleaks.toml --no-banner --redact --exit-code 1
      - name: Scan git history
        # Report-only for history specifically: a hit here means a credential
        # was published at some point, which needs rotation and a decision, not
        # a red build on an unrelated PR. The working-tree scan above is the
        # gate. Promote this to --exit-code 1 once history has been reviewed once.
        run: /tmp/gitleaks git . -c .gitleaks.toml --no-banner --redact --exit-code 0

  dependency-scan:
    name: Dependency vulnerabilities (report-only)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      # `--omit=dev` is deliberately NOT used: the one critical advisory is
      # vitest, a devDependency. Dev-only advisories still execute on this
      # runner and on contributors' machines.
      #
      # Promotion: replace `|| true` with `--audit-level=high` once F-24/F-25
      # (the next and vitest major migrations) have landed and the count is
      # near zero. Do it for root and web independently — root is already at 2
      # low and could gate today.
      - name: npm audit — root
        run: |
          npm ci --no-audit --no-fund
          npm audit --audit-level=low || true
      - name: npm audit — web
        run: |
          npm ci --no-audit --no-fund --prefix web
          npm audit --audit-level=low --prefix web || true

  sbom:
    name: SBOM (CycloneDX)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      # `npm sbom` is built into npm 10+, so this needs no third-party tool and
      # no registry fetch beyond the install that already happens. A CycloneDX
      # SBOM is the artifact enterprise customers and SOC 2 auditors ask for by
      # name; before this, the only answer to "what is in your build" was
      # "read package-lock.json".
      - name: Generate SBOMs
        run: |
          set -euo pipefail
          mkdir -p sbom
          npm ci --no-audit --no-fund
          npm sbom --sbom-format=cyclonedx > sbom/backend-sbom.cdx.json
          npm ci --no-audit --no-fund --prefix web
          npm sbom --sbom-format=cyclonedx --prefix web > sbom/web-sbom.cdx.json
          wc -c sbom/*.json
      # Report-only: the point of the first run is to produce the inventory, not
      # to adjudicate it. Promote to a failing gate once the licence policy has
      # been agreed (which families are acceptable is a business decision, not
      # an engineering default).
      - name: Licence inventory (report-only)
        run: node tools/license-scan.mjs sbom/backend-sbom.cdx.json sbom/web-sbom.cdx.json || true
      - name: Upload SBOMs
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ github.run_id }}
          path: sbom/
          retention-days: 90
