name: CI

# ─── Trigger rules (3-tier promotion pipeline) ────────────────────────────────
# develop → full CI + deploy to DEV      (Vercel preview, own dedicated Supabase)
# staging → full CI + deploy to TESTING  (Vercel preview alias, TESTING Supabase)
# master  → full CI + deploy to PROD      (Vercel --prod, PROD Supabase, ascendhqweb.vercel.app)
# PRs     → full CI, no deploy
# feature → no CI (local dev + pre-push hook); PR into develop to run CI
# Promotion is forward-only: feature/* → develop → staging → master.
on:
  push:
    branches: [develop, staging, master]
  pull_request:
    branches: [develop, staging, master]

# Least-privilege default for GITHUB_TOKEN: no job here needs to write to the
# repo or comment on PRs (Vercel deploys use VERCEL_TOKEN, not GITHUB_TOKEN).
# actions/checkout only needs read. deployments:write is kept because
# deploy-dev/staging/production declare `environment:` blocks, which GitHub
# uses to record deployment status/history against that token permission.
# Matches uptime.yml / backup.yml, which already scope permissions down.
permissions:
  contents: read
  deployments: write

# Vercel project IDs for scripts/deploy.sh, sourced from repo variables so a
# deleted or replaced project can be repointed WITHOUT a code change (Settings →
# Secrets and variables → Actions → Variables). Empty = deploy.sh keeps its own
# historical defaults, so this is a no-op until the variables are set.
# See docs/architecture/DEPLOYMENTS.md — the frontend default currently points
# at a project that returns "Project not found".
env:
  VERCEL_BACKEND_PROJECT_ID: ${{ vars.VERCEL_BACKEND_PROJECT_ID }}
  VERCEL_FRONTEND_PROJECT_ID: ${{ vars.VERCEL_FRONTEND_PROJECT_ID }}

# ─── Shared test jobs (run on every trigger) ──────────────────────────────────
jobs:
  guard:
    name: Production guard — lint anti-patterns
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # FIRST step in the whole pipeline, deliberately: it fails in seconds on a
      # swapped root manifest, before any job spends minutes reaching a confusing
      # `npm ci` error. Run as a bare `node`, never `npm run hygiene` — the whole
      # point is to survive a root package.json that has no scripts and a
      # preinstall hook that rejects npm. See check 8 in the script, and
      # WORK/audits/AUDIT_2026-08-03T110000Z-replit-pnpm-root-hijack-incident.md.
      - name: Root manifest integrity (package.json / lockfiles / tsconfig)
        run: node tools/hygiene-check.mjs
      # Backlog F-2, the twin of the SQL-injection guard's F-1 (fixed in
      # c00a485). This step used to be a grep pipeline ending in
      # `|| echo "All mutation routes have role guards ✓"`, which discarded the
      # pipeline's exit status — it printed a ✓ and exited 0 on every run since
      # the pipeline was written, and had never once evaluated the codebase.
      #
      # Repairing the `|| echo` alone would not have been enough: the grep only
      # recognised the literal text `requireRole` on the route's own line, while
      # this repo's dominant convention is a hoisted `const mgr =
      # requireRole("manager")` alias used across 20+ route files. Turned on
      # as-written it went red with 39 findings, the large majority false. A
      # check that cries wolf on arrival gets deleted, not fixed.
      #
      # Replaced with a real scanner that resolves local aliases, honours
      # router-level `router.use(guard)`, and recognises all five authorization
      # guards this codebase actually uses (requireRole / requirePermission /
      # requireScope / requireCapability / requireModule). Same 39 route
      # registrations, 4 genuine findings — one of which (quotes' hard DELETE)
      # was fixed in this change; the rest are allowlisted with reasons.
      # Shrink-only allowlist, same posture as the SQL guard's.
      - name: No unguarded mutation routes (PUT/PATCH/DELETE without an authz guard)
        run: npm run authz:scan
      - name: No console.log/error in production source (modules + gateway)
        run: |
          # shellcheck disable=SC2126 # grep|wc -l keeps this symmetric with the identical pattern below (AGENTS.md count)
          count=$(grep -rn --include="*.ts" "console\.\(log\|error\|warn\)" src/modules/ src/gateway/ \
            | grep -v "\.test\.ts" | wc -l | tr -d ' ')
          echo "Remaining console.* calls in modules/gateway: $count"
          if [ "$count" -gt "0" ]; then
            grep -rn --include="*.ts" "console\.\(log\|error\|warn\)" src/modules/ src/gateway/ | grep -v "\.test\.ts"
            exit 1
          fi
      - name: No raw SQL string interpolation (SQL injection risk)
        # This step was a no-op from the day it was written until 2026-08-05: the
        # BRE `\.query\(\`.*\${` leaves `\(` unclosed, so grep exited 2 with
        # "Unmatched ( or \(" — and the leading `!` inverted that error into a
        # pass. It could never fail. Rewritten as an explicit if/exit so a grep
        # error can no longer be laundered into success.
        #
        # Turning it on surfaced 6 pre-existing sites, all reviewed and all safe:
        # they interpolate *identifiers only* — `orderCol`/`modeCol`/`where` are
        # ternaries over closed unions yielding hardcoded column names, and
        # `sets` is built from object keys that are literal in the source. Every
        # caller-supplied value in them is bound through @param. They are
        # allowlisted by interpolated expression rather than by line number so
        # the guard does not false-fire when surrounding code shifts.
        #
        # Shrink-only: never add an entry here without proving the interpolated
        # text cannot carry request data.
        #
        # Two shellcheck-driven spellings, both deliberate — actionlint runs
        # shellcheck over this block and fails the job on SC2016 ("expressions
        # don't expand in single quotes"), which fires on anything inside single
        # quotes that *looks* like it was meant to expand. Both offenders here
        # are literal regex, so the warning is wrong, but the job still goes red:
        #   - no backtick in the pattern: matching the template literal's opening
        #     backtick reads as command substitution. Dropped in favour of `.*`,
        #     which is also strictly broader — it catches concatenated
        #     interpolation like `.query("… " + `${u}`)`, not just template
        #     literals (verified against a probe of that exact shape).
        #   - `{` written as the class `[{]` so the sequence `${` never appears.
        # Preferred over a blanket `shellcheck disable=SC2016`, which would also
        # mask a genuine quoting bug introduced into this step later.
        run: |
          violations=$(grep -rnE --include="*.ts" '\.query\(.*\$[{]' src/modules/ src/gateway/ \
            | grep -v '\.test\.ts' \
            | grep -vE '\$[{](orderCol|modeCol|where)[}]' \
            | grep -vE '\$[{]sets\.join\(' || true)
          if [ -n "$violations" ]; then
            echo "$violations"
            echo "❌ Raw string interpolation in SQL — use @param syntax"
            exit 1
          fi
          echo "No raw SQL interpolation found ✓"

      - name: No duplicate / copy-junk files committed
        run: |
          # macOS/editor/chat-export "<name> 2.<ext>" copies and merge
          # "*.collision-backup.md" files must never be tracked — they blocked
          # rebases and diverged the tree in the past. .gitignore prevents them;
          # this fails the build if one is force-added anyway.
          dupes=$(git ls-files | grep -E ' [0-9]+\.[A-Za-z0-9]+$|\.collision-backup\.md$' || true)
          if [ -n "$dupes" ]; then
            echo "❌ Duplicate/copy-junk files are tracked — remove them:"; echo "$dupes"; exit 1
          fi
          echo "No duplicate/copy-junk files tracked ✓"

      # (The former "Repo hygiene" step ran this same `node tools/hygiene-check.mjs`
      # a second time in this job — it is now the first step above, which covers
      # the identical ground plus root-manifest integrity. One invocation, not two.)
      - name: Prevention agent — no dirty drift or stray modules
        run: npm run prevent:drift

      - name: API gap scan — every frontend call has a backend route
        # Guards against pages shipping on MSW mocks while the real API 404s
        # (the AUDIT_2026-07-18T005030Z incident class). Deliberate Preview
        # surfaces live in tools/api-gap-allowlist.json, each tied to a board
        # entry. No deps; plain ESM on the runner's Node.
        run: npm run gap:scan

      # Backlog F-18. GATING, unlike the three report-only scans below, and it can
      # be because it is green on arrival: the 9 phantom operations this check
      # found on its first run were corrected in the same PR, so the count it
      # gates on is already zero. Nothing generates code from contracts/openapi.yaml
      # (orval reads a different, one-path lib/api-spec/openapi.yaml; web/api-client
      # is hand-maintained per F-21), so no compiler or type error will ever catch
      # drift here — this step is the only thing that does. The opposite direction
      # (a real route nobody documented) is merely incomplete: 478 of them today,
      # reported against tools/openapi-contract-baseline.json but never fatal.
      - name: OpenAPI contract scan — every documented operation is really served
        run: npm run contract:scan

      # Backlog F-15. REPORT-ONLY on purpose — the script exits 0 regardless.
      # The 2026-08-04 audit found two duplication defects by hand (48 copies of
      # test-request.ts; a private apiFetch beside the canonical one) that no
      # existing guard could catch, because they all look for something MISSING
      # or COLLIDING and duplication is neither. Gating on it now would fail
      # every PR until F-5 lands, and a check that blocks all work gets deleted
      # — so it reports first, exactly like docker-build and e2e did. Add
      # `--max <n>` here once the count is small and stable.
      - name: Duplicate-code scan (report-only)
        run: node tools/duplicate-code-scan.mjs

      # Backlog F-16. REPORT-ONLY, and it has to be: as of 2026-08-04 `web`
      # carries 14 advisories (1 critical, 9 high) and the root 2 low, so any
      # `--audit-level` gate fails every PR on arrival. Most need major bumps
      # (`next` 14->16, `vitest` 2->4) that are migrations, not fixes — tracked
      # as F-24/F-25. `|| true` keeps this a visible report until those land;
      # remove it (and pick an --audit-level) once the count is near zero.
      #
      # `--omit=dev` is NOT used: the critical finding is vitest, a devDependency.
      # Dev-only advisories still run on this runner and on contributors'
      # machines, so hiding them would defeat the point.
      # Backlog F-17, and what unblocks Phase 9.4's hallucination sweep.
      # REPORT-ONLY: 371 hits today, so any gate fails on arrival. The method
      # can only under-report (see the script header), which is the correct
      # bias for anything that leads to deleting code.
      - name: Dead-code scan (report-only)
        run: node tools/dead-code-scan.mjs

      # Backlog F-16. The root and `web` halves are deliberately asymmetric now.
      #
      # ROOT IS A REAL GATE (`--audit-level=high`, no `|| true`). The 2026-08-04
      # audit recorded "2 low at the root"; re-measured 2026-08-06 the root is at
      # **0 advisories of any severity**, so gating it costs nothing today and
      # means the next high/critical advisory to land on a backend dependency
      # (express, pg, jsonwebtoken, bcryptjs, stripe — the ones that actually
      # handle money, auth and untrusted input) fails the build instead of
      # scrolling past in a log nobody reads. Low/moderate stay reported, not
      # gated, so routine noise cannot block a release.
      #
      # WEB STAYS REPORT-ONLY, and this is not laziness — it is the honest
      # status. 10 advisories (1 critical, 6 high, 3 moderate) and every single
      # one resolves only through a semver-major migration: `next` 14 → 16 and
      # `vitest` 2 → 4 (F-24/F-25). Gating it would fail every PR from the first
      # run until those migrations land, and a check that blocks all work gets
      # deleted rather than fixed — the same reasoning docker-build, e2e and the
      # duplicate/dead-code scans were each introduced under.
      #
      # `--omit=dev` is NOT used on either half: the critical finding is vitest,
      # a devDependency whose UI server reads and executes arbitrary files.
      # Hiding dev-only advisories would defeat the point.
      #
      # Flip web to a gate in the same shape as root the moment F-24/F-25 land.
      - name: Dependency advisories — root (gates on high and above)
        run: |
          # A bare `npm audit --audit-level=high` also exits non-zero when the
          # registry is unreachable, and `guard` is the ONLY job here with no
          # `npm ci` — i.e. the only one that currently survives a registry
          # outage. Making it the first job to die on one would be a real
          # regression in CI resilience, and it would fail with a message that
          # reads like a vulnerability.
          #
          # So parse the report and decide from the counts: a genuine
          # high/critical advisory fails the build; an inconclusive run (no
          # report, unparseable JSON) warns and passes. The report-only step
          # below still prints the full detail either way.
          npm audit --json > /tmp/root-audit.json 2>/dev/null || true
          node -e '
            const fs = require("node:fs");
            let v = null;
            try { v = JSON.parse(fs.readFileSync("/tmp/root-audit.json", "utf8")).metadata.vulnerabilities; }
            catch { v = null; }
            if (!v) {
              console.log("::warning title=Dependency audit inconclusive::npm audit returned no parseable report (registry unreachable?). Not failing the build on an inconclusive result.");
              process.exit(0);
            }
            const n = (k) => Number(v[k] || 0);
            console.log("root advisories — critical:" + n("critical") + " high:" + n("high") + " moderate:" + n("moderate") + " low:" + n("low"));
            if (n("critical") + n("high") > 0) {
              // No backticks anywhere inside this single-quoted script: actionlint
              // runs shellcheck over the block and SC2016 reads a backtick in
              // single quotes as an unexpanded command substitution. Same trap the
              // SQL-injection guard step above documents.
              console.error("high/critical advisory in the root dependency tree. Reproduce with: npm audit");
              process.exit(1);
            }
            console.log("✓ no high or critical advisories in the root dependency tree");
          '
      - name: Dependency advisories — root + web (report-only detail)
        if: always()
        run: |
          echo "── root (low+, informational) ──"
          npm audit --audit-level=low || true
          echo "── web (blocked on the next@16 / vitest@4 migrations, F-24/F-25) ──"
          npm audit --audit-level=low --prefix web || true

      - name: One canonical agent-instruction file
        run: |
          # "1 file for all agents": exactly one root AGENTS.md; CLAUDE.md may
          # only exist as a short pointer to it. Guards against doc sprawl.
          # shellcheck disable=SC2126 # grep|wc -l keeps this symmetric with the identical pattern above (console.* count)
          count=$(git ls-files | grep -E '(^|/)AGENTS\.md$' | wc -l | tr -d ' ')
          if [ "$count" != "1" ]; then
            echo "❌ Expected exactly one AGENTS.md, found $count:"; git ls-files | grep -E 'AGENTS\.md$'; exit 1
          fi
          echo "One canonical AGENTS.md ✓"

      # Nothing previously validated workflow YAML itself — a typo in an `if:`
      # expression or a job name drift in `needs:` fails silently (skipped, not
      # red) until someone notices a deploy never ran. actionlint catches that
      # class of mistake (and shell bugs inside `run:` blocks, via its bundled
      # shellcheck integration) before merge.
      - name: Lint workflow YAML (actionlint)
        run: |
          # Pinned to an immutable release tag, not `main` — piping a curl'd
          # script from a mutable ref straight into bash is a supply-chain
          # risk (a compromised or force-pushed main would run arbitrary code
          # in CI on every PR). Bump ACTIONLINT_VERSION deliberately to update.
          ACTIONLINT_VERSION=1.7.12
          bash <(curl -fsSL "https://raw.githubusercontent.com/rhysd/actionlint/v${ACTIONLINT_VERSION}/scripts/download-actionlint.bash") "$ACTIONLINT_VERSION"
          ./actionlint -color

      # Shellcheck the standalone ops scripts (deploy/backup/restore/migration
      # runner) — these run unattended in CI and, for restore.sh, by hand
      # during an incident, so a quoting bug is exactly the kind of thing that
      # should fail fast in review instead of at 2am during a restore.
      # --severity=error only (not warning/style): two pre-existing warnings
      # (scripts/deploy.sh:84 redundant env prefix, db/backup/restore.sh:168
      # unused $pg_flags) are harmless and left as follow-up cleanup rather
      # than gating CI on style-level findings.
      - name: Shellcheck — deploy/backup/restore/migration scripts
        run: |
          shellcheck --severity=error \
            scripts/deploy.sh \
            db/backup/backup.sh \
            db/backup/restore.sh \
            db/migrations/run.sh

  backend:
    name: Backend — typecheck + test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: finder_test
        ports: ["5432:5432"]
        # --shm-size: Docker's default /dev/shm is 64MB; the backend suite is now
        # 700+ tests and Postgres exhausts it mid-run ("could not resize shared
        # memory segment ... No space left on device"), cascading into mass
        # failures. 1g gives ample headroom (first hit: PR #81, 2026-07-19).
        options: >-
          --shm-size=1g
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/finder_test
      JWT_SECRET: ci-test-secret-not-for-production
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # Strongest real-DB gate: boots the assembled app on the service Postgres
      # and drives the full POS lifecycle over HTTP, asserting zero failed
      # workflow instances. Uses its own throwaway schema, so it cannot clash
      # with the unit-test database state.
      - name: Smoke — full POS lifecycle on real Postgres
        run: npm run smoke

  frontend:
    name: Frontend — typecheck + lint + test + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      # web/tests (179 vitest tests) previously ran nowhere in CI — only the
      # backend suite was gated. That is how 3 failing api-client tests sat
      # green-by-omission, and it would equally have hidden routeIntegrity,
      # the guard against linking to deleted pages. Gate them here.
      - run: npm test
      - run: npm run build

  # ─── Required-check compatibility shim (DELETE once protection is corrected) ─
  # `master`'s branch protection requires a check literally named
  # "Frontend — typecheck + lint + build". Commit 1a4b989 (2026-08-05) renamed
  # the job above to "… + test + build" without updating protection, and a
  # required check that no job emits is never satisfied AND never fails — it
  # sits permanently "expected". The merge button has therefore been dead for
  # every PR into `master` since that date, which is why `master` has not moved
  # since 2026-07-23. Verified by GitHub's own refusal on the PR #200 release
  # attempt: `405 Required status check "…" is expected`.
  #
  # This job re-emits the required name. It deliberately does NOT rename the
  # real job — that name is accurate (it does run the web tests), and renaming
  # would risk breaking develop/staging protection, which may already require
  # the new name. Adding a name is safe under every branch's config; removing
  # one is not.
  #
  # `if: always()` is load-bearing. Without it a failed `frontend` SKIPS this
  # job, and GitHub can treat a skipped required check as satisfied — which
  # would recreate the original bug in reverse: a required check that cannot
  # fail. The explicit result assertion is what makes this a real gate.
  #
  # EXIT CONDITION: delete this job when branch protection is updated to
  # require "Frontend — typecheck + lint + test + build" (the preferred remedy,
  # Sri-only — the protection API returns 403 to agents). Keep this file and
  # PIPELINE.md's required-check list in sync when that happens.
  frontend-required-name-shim:
    name: Frontend — typecheck + lint + build
    needs: [frontend]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Mirror the frontend job's result
        env:
          FRONTEND_RESULT: ${{ needs.frontend.result }}
        run: |
          echo "frontend job result: $FRONTEND_RESULT"
          if [ "$FRONTEND_RESULT" != "success" ]; then
            echo "::error title=Frontend gate failed::The 'Frontend — typecheck + lint + test + build' job did not succeed (result: $FRONTEND_RESULT)."
            exit 1
          fi
          echo "✓ frontend gate passed"

  # ─── Docker build sanity check ─────────────────────────────────────────────
  # Nothing previously exercised the Dockerfile at all — the node:20-alpine vs
  # .nvmrc's node:24 drift found this session sat undetected indefinitely.
  # Vercel (not Docker) is the actual deploy path, so this is deliberately a
  # build-only sanity check (no push, no run/boot) — cheap, and it would have
  # caught that exact drift automatically. NOT yet in any deploy `needs` or
  # branch-protection required checks: this is its first-ever run in CI, and
  # nothing should hard-gate on an unproven check (same reasoning applied to
  # e2e earlier in this pipeline's history — prove it green first).
  docker-build:
    name: Docker build (sanity check, non-blocking)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --target runtime -t ascend-backend:ci .

  # ─── E2E tests (master + staging pushes only, after backend + frontend pass) ─
  e2e:
    name: E2E tests (Playwright — golden paths)
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: finder_e2e
        ports: ["5432:5432"]
        # --shm-size=1g: same shared-memory headroom as the backend job above.
        options: >-
          --shm-size=1g
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    # NODE_ENV is deliberately NOT "production" here: production mode forces
    # SSL to Postgres (the CI service container has no SSL) and marks auth
    # cookies Secure (rejected by the browser over plain-HTTP localhost), so a
    # production-mode backend can never pass login on a CI runner. Production
    # behavior is verified by the staging/production smoke tests over HTTPS.
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/finder_e2e
      JWT_SECRET: e2e-test-secret-not-for-production
      NODE_ENV: test
      FINDER_BACKGROUND_JOBS: "false"
      PORT: 3001
      # Root cause of the login flake (confirmed via a Playwright trace DOM
      # snapshot showing "Too many requests — slow down." on the login page):
      # /api/identity is rate-limited per-IP (10 burst, 0.33/s refill — a
      # brute-force guard, correct for prod). The whole suite runs from ONE CI
      # runner IP and needs dozens of login/probe requests (global setup, every
      # worker-restart self-heal login, login.spec.ts's 3 tests, every retry),
      # which exhausts the bucket fast; once tripped, every spec needing auth
      # fails simultaneously (matches the observed cross-spec cascade) until it
      # slowly refills. See docs/architecture/PIPELINE.md. Defaults (10, 0.33)
      # are unchanged everywhere this isn't explicitly set — prod security is
      # untouched.
      IDENTITY_RATE_LIMIT_CAPACITY: "1000"
      IDENTITY_RATE_LIMIT_REFILL: "100"
      # Same single-IP cascade risk for register + SSO handshake paths
      # (defaults are even tighter than login). Keep prod defaults unchanged.
      IDENTITY_REGISTER_RATE_CAPACITY: "1000"
      IDENTITY_REGISTER_RATE_REFILL: "100"
      SSO_RATE_LIMIT_CAPACITY: "1000"
      SSO_RATE_LIMIT_REFILL: "100"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      # ── Build and start the backend ─────────────────────────────────────────
      - name: Install backend deps
        run: npm ci --include=dev
      - name: Build backend
        run: npx tsc -p tsconfig.json
      # Diagnostic instrumentation (2026-07-18, tracking the e2e login flake
      # documented in docs/architecture/PIPELINE.md): stdout/stderr was
      # previously discarded — this step's own log capture ends the instant
      # the backgrounded process starts, so nothing about later requests was
      # ever visible. Redirect to a file and set LOG_LEVEL=debug so a future
      # failure has real evidence instead of another blind guess.
      - name: Start backend (background)
        run: LOG_LEVEL=debug node dist/src/server.js > /tmp/backend.log 2>&1 &
      - name: Wait for backend
        run: |
          for _ in $(seq 1 20); do
            curl -sf http://localhost:3001/healthz && exit 0
            sleep 2
          done
          echo "❌ backend never became healthy on :3001"
          cat /tmp/backend.log || true
          exit 1
      # Correlates backend availability with the Playwright timeline: if the
      # backend stalls, crashes, or restarts mid-run, this is the only place
      # that would show it (no per-request access logging exists yet).
      - name: Start backend health poller (background)
        run: |
          ( while true; do
              printf '%s %s\n' "$(date -u +%H:%M:%S)" "$(curl -s -o /dev/null -w '%{http_code}' --max-time 3 http://localhost:3001/healthz || echo timeout)" >> /tmp/backend-health.log
              sleep 2
            done ) &
      - name: Seed E2E demo data
        run: npx tsx scripts/seed-e2e.ts
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/finder_e2e
          # Opt-in required by the script's production guard — this is the
          # ephemeral CI Postgres service, never a real database.
          ALLOW_E2E_SEED: "1"
      # ── Build and start the frontend ────────────────────────────────────────
      - name: Install frontend deps
        run: npm ci --include=dev
        working-directory: web
      # NEXT_PUBLIC_MOCK=false is what makes this a REAL e2e run: the default
      # is mock mode, and the previously used NEXT_PUBLIC_E2E_MODE flag is read
      # by nothing. API base stays empty → same-origin calls proxied to the
      # backend via next.config rewrites (BACKEND_URL, baked at build time),
      # which avoids production CORS restrictions on the backend.
      - name: Build frontend
        run: npm run build
        working-directory: web
        env:
          NEXT_PUBLIC_MOCK: "false"
          BACKEND_URL: http://localhost:3001
      # output is "standalone": `next start` refuses that config — run the
      # generated server.js with static assets and public/ copied in.
      - name: Start frontend (background)
        run: |
          cp -r .next/static .next/standalone/.next/static
          cp -r public .next/standalone/public
          (PORT=3000 HOSTNAME=127.0.0.1 node .next/standalone/server.js > /tmp/frontend.log 2>&1 &)
        working-directory: web
      - name: Wait for frontend
        run: |
          for _ in $(seq 1 20); do
            curl -sf http://localhost:3000/login >/dev/null && exit 0
            sleep 3
          done
          echo "❌ frontend never became healthy on :3000"
          cat /tmp/frontend.log || true
          exit 1
      # ── Run Playwright ───────────────────────────────────────────────────────
      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps
        working-directory: web
      - name: Run E2E tests
        run: npx playwright test --reporter=github
        working-directory: web
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3000
          E2E_EMAIL: owner@ascend.dev
          E2E_PASSWORD: AscendDemo!2026
      # `--reporter=github` (above) only emits GH Actions annotations — it does
      # NOT write an HTML report, so web/playwright-report/ has been empty on
      # every past run and this upload was silently capturing nothing (found
      # while investigating the login flake: no artifact was ever downloadable
      # from a failed run). screenshot/video/trace are still written to
      # web/test-results/ regardless of reporter — upload that instead, since
      # it's the only place the actual browser evidence exists.
      - name: Upload Playwright test-results (screenshots/video/trace) on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: web/test-results/
          retention-days: 7
          if-no-files-found: warn
      # Diagnostic — print + upload the backend log and health-poll timeline
      # regardless of outcome, so a green run establishes the healthy baseline
      # and a red run has real evidence instead of another blind guess.
      - name: Show backend log + health timeline
        if: always()
        run: |
          echo "── backend.log (last 200 lines) ──"
          tail -n 200 /tmp/backend.log || echo "(no backend.log)"
          echo "── backend-health.log (last 60 samples) ──"
          tail -n 60 /tmp/backend-health.log || echo "(no backend-health.log)"
      - name: Upload backend log + health timeline
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-diagnostics
          path: |
            /tmp/backend.log
            /tmp/backend-health.log
          retention-days: 7

  # ─── DEV deploy (push to develop only) ─────────────────────────────────────
  # Deploys BOTH projects as Vercel previews, sharing the SAME testing Supabase
  # project as staging (Sri directive, 2026-07-20: exactly 2 databases — one
  # shared by develop+staging, one isolated for prod — not three). No
  # DATABASE_URL override here on purpose: the backend falls back to whatever
  # is stored in the Vercel project's own Preview environment vars, which is
  # the same value staging's deploy uses below. Repo variables carry the
  # non-secret dev origins.
  deploy-dev:
    name: Deploy → Dev (Vercel preview)
    # e2e runs in parallel as a reported signal but does NOT gate deploys — the
    # golden-path suite has a known auth-rotation timing flake (see PIPELINE.md).
    # Re-add `e2e` here once that flake is fixed to make it a hard deploy gate.
    needs: [guard, backend, frontend, e2e]
    runs-on: ubuntu-latest
    # Skips (does not fail) until the dev tier is configured — set the repo
    # variable DEV_BACKEND_URL to activate.
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push' && vars.DEV_BACKEND_URL != ''
    environment:
      name: Preview
      url: https://${{ vars.DEV_FRONTEND_ALIAS }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Deploy dev → Vercel preview
        run: ./scripts/deploy.sh "${{ vars.DEV_DEPLOY_TARGET || 'both' }}"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          DEPLOY_ENV: dev
          NEXT_PUBLIC_MOCK: "false"
          BACKEND_URL: ${{ vars.DEV_BACKEND_URL }}
          BACKEND_ALIAS: ${{ vars.DEV_BACKEND_ALIAS }}
          FRONTEND_ALIAS: ${{ vars.DEV_FRONTEND_ALIAS }}
      - name: Dev smoke test
        run: |
          sleep 10
          curl -fsS --retry 3 --retry-delay 5 "${{ vars.DEV_BACKEND_URL }}/healthz" \
            || (echo "❌ dev backend /healthz failed — check DEV_BACKEND_URL var + Vercel Preview env" && exit 1)
          curl -fsS --retry 3 --retry-delay 5 "${{ vars.DEV_BACKEND_URL }}/readyz" \
            || (echo "❌ dev backend /readyz failed (DB not reachable — check the shared testing Supabase project)" && exit 1)

  # ─── TESTING deploy (push to staging only) ─────────────────────────────────
  # Deploys BOTH projects as Vercel previews aliased to stable staging domains,
  # pointing at the TESTING backend/DB (Supabase B). Then smoke-tests the alias.
  deploy-staging:
    name: Deploy → Testing (Vercel preview alias)
    # e2e runs in parallel as a reported signal but does NOT gate deploys — the
    # golden-path suite has a known auth-rotation timing flake (see PIPELINE.md).
    # Re-add `e2e` here once that flake is fixed to make it a hard deploy gate.
    needs: [guard, backend, frontend, e2e]
    runs-on: ubuntu-latest
    # Skips (does not fail) until the testing tier is configured — set the repo
    # variables STAGING_BACKEND_URL/_ALIAS/_FRONTEND_ALIAS + Vercel Preview env.
    if: github.ref == 'refs/heads/staging' && github.event_name == 'push' && vars.STAGING_BACKEND_URL != ''
    environment:
      name: staging
      url: https://${{ vars.STAGING_FRONTEND_ALIAS }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Target is a repo variable (both | frontend | backend), default `both`.
      # Set STAGING_DEPLOY_TARGET=frontend when the staging backend is hosted
      # outside Vercel (e.g. Render git auto-deploy, as production already is) —
      # otherwise deploy.sh tries to push the backend to a Vercel project that
      # may not exist and fails the whole job.
      - name: Deploy testing → Vercel preview alias
        run: ./scripts/deploy.sh "${{ vars.STAGING_DEPLOY_TARGET || 'both' }}"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          DEPLOY_ENV: testing
          NEXT_PUBLIC_MOCK: "false"
          BACKEND_URL: ${{ vars.STAGING_BACKEND_URL }}
          BACKEND_ALIAS: ${{ vars.STAGING_BACKEND_ALIAS }}
          FRONTEND_ALIAS: ${{ vars.STAGING_FRONTEND_ALIAS }}
      - name: Testing smoke test
        run: |
          sleep 10
          curl -fsS --retry 3 --retry-delay 5 "${{ vars.STAGING_BACKEND_URL }}/healthz" \
            || (echo "❌ testing backend /healthz failed — check STAGING_BACKEND_URL var + Vercel Preview env" && exit 1)
          curl -fsS --retry 3 --retry-delay 5 "${{ vars.STAGING_BACKEND_URL }}/readyz" \
            || (echo "❌ testing backend /readyz failed (DB not reachable — check Supabase B)" && exit 1)

  # ─── PROD deploy (push to master only) ─────────────────────────────────────
  # Deploys BOTH projects to Vercel Production (--prod) against the PROD Supabase.
  # Single deploy authority (deploy-prod.yml was removed to avoid double-deploys).
  deploy-production:
    name: Deploy → Production (Vercel --prod)
    # e2e runs in parallel as a reported signal but does NOT gate deploys — the
    # golden-path suite has a known auth-rotation timing flake (see PIPELINE.md).
    # Re-add `e2e` here once that flake is fixed to make it a hard deploy gate.
    needs: [guard, backend, frontend, e2e]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    environment:
      name: Production
      url: ${{ vars.PROD_FRONTEND_URL || 'https://ascendhqweb.vercel.app' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Default is `frontend`, NOT `both`, and that is deliberate.
      #
      # `both` invokes deploy.sh's deploy_backend, which uploads to Vercel
      # project prj_krZ34CIFjzQrMvZ08PWqqbxzBf7d. DEPLOYMENTS.md records that
      # project as CONFIRMED BROKEN: it resolves, but serves a bare, unrelated
      # Express app — not this repo's backend. Deploying there on every release
      # can only produce noise or a red release check.
      #
      # The real production backend is Render service "Ascend Prod"
      # (srv-d9lo8jm7bikc739dnsn0, Docker runtime, deploying from this repo's
      # `master` branch) — confirmed by Sri from the Render dashboard
      # 2026-08-08. Render's own git integration deploys the backend on a push
      # to `master`. A release therefore ships the backend through Render and
      # the frontend through Vercel, by two entirely separate mechanisms, and
      # only the second one belongs in this job.
      #
      # smoke-test below still probes BOTH halves — CI no longer deploys the
      # backend, but it must keep verifying it.
      #
      # `vars.PROD_DEPLOY_TARGET` still overrides, so restoring the old
      # behaviour is one repo variable away if the Render/Vercel decision in
      # DEPLOYMENTS.md P1 ever resolves the other way.
      - name: Deploy production → Vercel --prod
        run: ./scripts/deploy.sh "${{ vars.PROD_DEPLOY_TARGET || 'frontend' }}"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN_PROD }}
          DEPLOY_ENV: prod
          NEXT_PUBLIC_MOCK: "false"
          # `web/next.config.mjs` reads BACKEND_URL inside `rewrites()`, which
          # Next evaluates at BUILD time and freezes into routes-manifest.json.
          # It is therefore the origin the shipped production bundle proxies
          # every /api/* call to, and it cannot be changed afterwards from the
          # Vercel dashboard — only by rebuilding with a different value.
          #
          # This job never passed one, so production fell through to deploy.sh's
          # default, https://ascendhq-api.vercel.app, dead since the 2026-07-20
          # Render cutover. That is not a red check, it is a dead product: the
          # release ships a frontend whose every API call resolves to a host
          # that does not exist, so no user can log in. deploy-staging has read
          # `vars.STAGING_BACKEND_URL` since it was written — production is the
          # one tier that never got the same wiring. The repointable prod
          # *probes* landed in PR #197; the prod *build* was left behind.
          #
          # Unset resolves to empty and deploy.sh's own default still applies,
          # so this changes no behaviour on its own. Setting PROD_BACKEND_URL —
          # the same variable smoke-test and uptime.yml already read — is what
          # makes production reachable.
          BACKEND_URL: ${{ vars.PROD_BACKEND_URL }}

  # ─── Production smoke test ─────────────────────────────────────────────────
  smoke-test:
    name: Post-deploy smoke test (production)
    needs: [deploy-production]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    # Probe targets come from the SAME repo variables uptime.yml already uses.
    # Before this, the release smoke test hardcoded its hostnames, which left the
    # two production probes in this repo able to disagree about where production
    # is: setting PROD_BACKEND_URL fixed the heartbeat and did nothing for the
    # release gate. One variable, both probes (ADR-009).
    #
    # Fallbacks are deliberately asymmetric, because the two halves are:
    #   FRONTEND — `ascendhqweb.vercel.app`, CONFIRMED live by Sri 2026-08-07
    #              (Vercel project `ascend_hq_web`, PR #201). A working default.
    #   BACKEND  — `ascendhq-api.vercel.app`, known DEAD (DEPLOYMENT_NOT_FOUND
    #              since 2026-07-23). Kept only so this file changes no behaviour
    #              on its own; the real prod backend host is still the open P0 in
    #              docs/architecture/DEPLOYMENTS.md. Setting PROD_BACKEND_URL is
    #              what fixes both this gate and the heartbeat, in one edit.
    env:
      BACKEND: ${{ vars.PROD_BACKEND_URL || 'https://ascend-prod.onrender.com' }}
      FRONTEND: ${{ vars.PROD_FRONTEND_URL || 'https://ascendhqweb.vercel.app' }}
    steps:
      - name: Show probe targets
        run: |
          echo "backend:  $BACKEND"
          echo "frontend: $FRONTEND"
      - name: Wait for Vercel propagation
        run: sleep 15
      # The BACKEND probes below carry uptime.yml's widened timeouts, not the
      # 15-seconds-of-retries they used to. Two independent reasons, both of
      # which make the old values able to fail a perfectly good release:
      #
      #   1. CI no longer deploys the backend (see deploy-production above) —
      #      Render's git integration does, asynchronously, triggered by the
      #      same push. So this job can easily start probing while Render is
      #      still building. `--retry 3 --retry-delay 5` gave up ~15s in.
      #   2. Production is a Render FREE instance that cold-starts in ~50s. A
      #      timeout shorter than the cold start does not measure availability,
      #      it measures the timeout — the mistake that had this repo believing
      #      production was dead from three networks that were independent in
      #      location and identical in timeout.
      #
      # `--retry-all-errors` matters specifically for reason 1: without it curl
      # does not retry connection-level failures, which is exactly what a
      # mid-deploy Render service returns.
      #
      # The FRONTEND probe keeps a tighter budget deliberately: Vercel is
      # deployed synchronously by the previous job and does not cold-start, so a
      # slow answer there is a real signal, not a scheduling artefact.
      - name: Health check — backend liveness
        run: |
          curl -fsS --max-time 90 --retry 5 --retry-delay 10 --retry-all-errors \
            "$BACKEND/healthz" \
            || (echo "❌ /healthz failed against $BACKEND" && exit 1)
      - name: Health check — backend readiness
        run: |
          curl -fsS --max-time 90 --retry 5 --retry-delay 10 --retry-all-errors \
            "$BACKEND/readyz" \
            || (echo "❌ /readyz failed against $BACKEND" && exit 1)
      - name: Health check — feature flags auth boundary
        run: |
          http_status="$(curl -sS --max-time 90 --retry 5 --retry-delay 10 --retry-all-errors \
            -o /tmp/flags-response.json \
            -w '%{http_code}' \
            "$BACKEND/api/v1/flags")"
          if [ "$http_status" != "401" ]; then
            echo "❌ /api/v1/flags without auth returned $http_status, expected 401"
            cat /tmp/flags-response.json
            exit 1
          fi
      - name: Health check — frontend
        run: |
          curl -f --retry 3 --retry-delay 5 \
            "$FRONTEND/" \
            || (echo "❌ frontend failed against $FRONTEND" && exit 1)
