# Dependency updates — backlog item F-16.
#
# The 2026-08-04 audit scored Security 80 without ever running a dependency
# audit; that was a gap in the audit, not a clean result. Running one found
# 14 advisories in `web` (1 critical, 9 high, 4 moderate) and 2 low at the
# root. Nothing was watching for them, and nothing would have told anyone when
# the next one landed. `pnpm-workspace.yaml` already carried a
# `minimumReleaseAge` supply-chain defence, so the intent existed here long
# before the check did.
#
# Deliberately conservative, because this repo's dominant failure mode is not
# stale dependencies — it is merge chaos across parallel AI sessions (five
# foreign-workspace root hijacks in two days). A default Dependabot config
# would open a dozen PRs into that. So:
#
#   - grouped: one PR per ecosystem for minor+patch, not one per package;
#   - open-pull-requests-limit kept low, so the queue can never flood `develop`;
#   - major bumps are NOT auto-proposed — `next` 14 -> 16 and `vitest` 2 -> 4
#     are real migrations tracked as backlog items, not drive-by merges.
#
# Security advisories bypass the grouping and limit by design: those are the
# ones worth interrupting for.
version: 2
updates:
  # Backend / repo root.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    labels: [dependencies]
    commit-message:
      prefix: "chore(deps)"
    groups:
      root-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      # Majors are migrations, not updates — see F-24/F-25.
      - dependency-name: "*"
        update-types: [version-update:semver-major]

  # Frontend.
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    labels: [dependencies, frontend]
    commit-message:
      prefix: "chore(deps)"
    groups:
      web-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: [version-update:semver-major]

  # Workflow actions — this repo already pins actionlint by release tag for
  # supply-chain reasons; the same care applies to the actions themselves.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    labels: [dependencies, ci]
    commit-message:
      prefix: "ci(deps)"
