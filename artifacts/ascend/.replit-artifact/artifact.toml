kind = "web"
previewPath = "/"
title = "Ascend POS"
version = "1.0.0"
id = "artifacts/ascend"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23018

[services.development]
run = "pnpm --filter @workspace/ascend run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/ascend", "run", "build" ]
serve = "static"
publicDir = "artifacts/ascend/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23018"
BASE_PATH = "/"
