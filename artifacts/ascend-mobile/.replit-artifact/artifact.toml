kind = "mobile"
previewPath = "/mobile/"
title = "Ascend Mobile"
version = "1.0.0"
id = "artifacts/ascend-mobile"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/mobile/" ]
localPort = 21494

[services.development]
run = "pnpm --filter @workspace/ascend-mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/ascend-mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/ascend-mobile", "run", "serve" ]

[services.env]
PORT = "21494"
BASE_PATH = "/mobile/"
